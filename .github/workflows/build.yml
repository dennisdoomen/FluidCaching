
name: Build

on: [push, pull_request]

jobs:
  build:
    name: "Build, Test, Analyze and Publish"
    runs-on: windows-latest

    permissions:
      id-token: write
      attestations: write
      contents: write
      security-events: write
      actions: write
      code-quality: write

    env:
      DOTNET_NOLOGO: false

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: NuGet login (OIDC)
      if: startsWith(github.ref, 'refs/tags/')
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Run NUKE
      run: ./build.ps1
      env:
        NugetArtifactsApiKey: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        GitHubApiKey: ${{ secrets.GITHUB_TOKEN }}

    - name: Find coverage files
      id: find_coverage
      shell: pwsh
      run: |
        $files = Get-ChildItem -Path TestResults -Recurse -Filter "coverage.cobertura.xml" -File | Select-Object -First 1
        if ($files) {
          $coverageFile = $files.FullName
          Write-Output "coverage_file=$coverageFile" >> $env:GITHUB_OUTPUT
          Write-Host "Found coverage file: $coverageFile"
        } else {
          Write-Host "No coverage file found"
        }

    - name: Upload code coverage
      uses: actions/upload-code-coverage@v1
      if: steps.find_coverage.outputs.coverage_file != ''
      continue-on-error: true
      with:
        language: csharp
        file: ${{ steps.find_coverage.outputs.coverage_file }}
        label: code-coverage/fluidcaching
        fail-on-error: false

    - name: Check for 'lcov.info' existence
      id: check_files
      uses: andstor/file-existence-action@v3
      with:
        files: "TestResults/reports/lcov.info"

    - name: coveralls
      uses: coverallsapp/github-action@v2
      if: steps.check_files.outputs.files_exists == 'true'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: TestResults/reports/lcov.info

    - name: Check for NuGet package existence
      id: check_nupkg
      if: startsWith(github.ref, 'refs/tags/')
      uses: andstor/file-existence-action@v3
      with:
        files: "Artifacts/*.nupkg"

    - name: Attest NuGet package
      uses: actions/attest-build-provenance@v4
      if: startsWith(github.ref, 'refs/tags/') && steps.check_nupkg.outputs.files_exists == 'true'
      with:
        subject-path: ./Artifacts/*.nupkg

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: Artifacts/CodeIssues.sarif

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-artifacts
        path: |
          ./Artifacts/*
          ./TestResults/*.trx

  publish-test-results:
    name: "Publish Tests Results"
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    if: always()

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        comment_mode: always
        files: "artifacts/**/**/*.trx"

